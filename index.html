<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO -->
    <meta 
        name="description" 
        content="Pocket Watch is a personal finance web app that helps you track your spending and savings and better understand how you manage your money."
    >
    <meta name="author" content="Gonçalo Pinto">
    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="Pocket Watch">
    <meta 
        property="og:description" 
        content="A personal finance web app to track your spending and savings and better understand how you manage your money."
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pocket-watch-murex.vercel.app/">
    <!-- <meta property="og:image" content="https://pocket-watch-murex.vercel.app/assets/preview.png"> -->
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pocket Watch">
    <meta 
        name="twitter:description" 
        content="A personal finance web app to track your spending and savings and better understand how you manage your money."
    >
    <!-- <meta name="twitter:image" content="https://pocket-watch-murex.vercel.app/assets/preview.png"> -->
    <!-- Favicon -->
    <link rel="shortcut icon" id="shortcut-icon" type="image/x-icon" href="/assets/icons/light/favicon.ico">
    <link rel="icon" id="favicon-16" type="image/png" sizes="16x16" href="/assets/icons/light/favicon-16x16.png">
    <link rel="icon" id="favicon-32" type="image/png" sizes="32x32" href="/assets/icons/light/favicon-32x32.png">
    <link rel="apple-touch-icon" id="apple-touch-icon" sizes="180x180" href="/assets/icons/light/apple-touch-icon.png">
    <link rel="manifest" id="manifest-link" href="/assets/icons/light/site.webmanifest">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> <!-- Bootstrap Icons -->
    <title>Pocket Watch</title>
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="menu-placeholder"></div>
    <main id="main-content" class="main-content">
        <div id="priority-content" class="priority-content">
            <div id="balance-column" class="balance-column">
                <div id="balance-div" class="container balance-div">
                    <svg class="balance-dial" style="bottom: -45px; left: -25px;" width="150" height="150" viewBox="0 0 150 150">
                        <circle cx="75" cy="75" r="66" fill="none" stroke="var(--border-color)" stroke-width="2"/>
                        <circle cx="75" cy="75" r="46" fill="none" stroke="var(--border-color)" stroke-width="1.5"/>
                        <g class="dial-crack">
                            <path class="crack-main" d="M 108 18 L 101 30 L 106 36 L 93 50 L 98 56 L 87 70" fill="none" stroke="var(--negative-color)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path class="crack-branch" d="M 106 36 L 117 40 L 124 36" fill="none" stroke="var(--negative-color)" stroke-width="0.6" stroke-linecap="round"/>
                            <path class="crack-branch" d="M 98 56 L 89 54 L 83 60" fill="none" stroke="var(--negative-color)" stroke-width="0.5" stroke-linecap="round"/>
                            <path class="crack-branch" d="M 101 30 L 93 22" fill="none" stroke="var(--negative-color)" stroke-width="0.5" stroke-linecap="round"/>
                        </g>
                        <line class="dial-needle dial-needle-v" x1="75" y1="75" x2="75" y2="34" stroke="var(--accent-color)" stroke-width="3"/>
                        <line class="dial-needle dial-needle-h" x1="75" y1="75" x2="103" y2="75" stroke="var(--accent-color)" stroke-width="3"/>
                    </svg>
                    <h1 id="balance-label" class="container-title">Current Balance</h1>
                    <h1 id="balance-value" class="balance-value"></h1>
                </div>

                <div id="sr-div" class="sr-div">
                    <div id="spending-div" class="container sr-item">
                        <h1 class="container-title">Spending</h1>
                        <div id="no-spending" class="sr-empty">
                            <i class="bi bi-arrow-down-circle sr-empty-icon" aria-hidden="true"></i>
                            <p class="sr-empty-title">No spending yet</p>
                            <p class="sr-empty-subtitle">Expenses you add will show up here.</p>
                        </div>
                        <ul id="spending-list" class="sr-list">
                        </ul>
                    </div>

                    <div id="receiving-div" class="container sr-item">
                        <h1 class="container-title">Receiving</h1>
                        <div id="no-receiving" class="sr-empty">
                            <i class="bi bi-arrow-up-circle sr-empty-icon" aria-hidden="true"></i>
                            <p class="sr-empty-title">No receiving yet</p>
                            <p class="sr-empty-subtitle">Income you add will show up here.</p>
                        </div>
                        <ul id="receiving-list" class="sr-list">
                        </ul>
                    </div>
                </div>
            </div>

            <div id="transactions-div" class="container transactions-div">
                <h1 class="container-title">Transactions <button id="add-transaction-btn" class="add-btn">+</button></h1>
                <div id="transactions-empty" class="transactions-empty hidden">
                    <i class="bi bi-receipt transactions-empty-icon" aria-hidden="true"></i>
                    <p class="transactions-empty-title">No transactions yet</p>
                    <p class="transactions-empty-subtitle">Add your first one to start tracking your spending and income.</p>
                </div>
                <ul id="transactions-list" class="transactions-list">
                </ul>
            </div>
        </div>
        <div id="transaction-modal-overlay" class="modal-overlay">
            <div id="transaction-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="transaction-modal-title">
                <div class="modal-header">
                    <h1 id="transaction-modal-title" class="container-title">Add Transaction</h1>
                    <button id="close-modal-btn" class="close-btn" aria-label="Close">
                        <i class="bi bi-x" aria-hidden="true"></i>
                    </button>
                </div>

                <form id="transaction-form" class="modal-form">
                    <div class="form-group">
                        <label for="transaction-name">Name</label>
                        <input type="text" id="transaction-name" name="transaction-name" placeholder="e.g. Groceries" required>
                    </div>

                    <div class="form-group">
                        <label>Type</label>
                        <div class="type-toggle">
                            <input type="radio" id="type-spending" name="transaction-type" value="spending" checked>
                            <label for="type-spending" class="type-option type-spending">
                                <i class="bi bi-arrow-down-circle" aria-hidden="true"></i> Spending
                            </label>

                            <input type="radio" id="type-receiving" name="transaction-type" value="receiving">
                            <label for="type-receiving" class="type-option type-receiving">
                                <i class="bi bi-arrow-up-circle" aria-hidden="true"></i> Receiving
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="transaction-amount">Amount</label>
                        <div class="amount-input-wrap">
                            <span class="amount-currency">€</span>
                            <input type="number" id="transaction-amount" name="transaction-amount" placeholder="0.00" step="0.01" min="0" inputmode="decimal" required>
                        </div>
                        <span id="amount-error" class="input-error hidden">Amount must be greater than 0€</span>
                    </div>

                    <div class="form-group">
                        <label for="transaction-date">Date</label>
                        <input type="date" id="transaction-date" name="transaction-date" required>
                    </div>

                    <div class="form-group">
                        <label for="transaction-category-spending" class="category-label-spending">
                            Category
                        </label>
                        <select id="transaction-category-spending" name="transaction-category-spending" class="category-select-spending">
                            <option value="Other">Other</option>
                            <option value="Food">Food</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Transport">Transport</option>
                            <option value="Housing">Housing</option>
                            <option value="Bills">Bills & Utilities</option>
                            <option value="Health">Health</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Education">Education</option>
                        </select>

                        <label for="transaction-category-receiving" class="category-label-receiving">
                            Category
                        </label>
                        <select id="transaction-category-receiving" name="transaction-category-receiving" class="category-select-receiving">
                            <option value="Other">Other</option>
                            <option value="Salary">Salary</option>
                            <option value="Gift">Gift</option>
                            <option value="Investment">Investment</option>
                            <option value="Loan">Loan</option>
                            <option value="Refund">Refund</option>
                            <option value="Freelance">Freelance</option>
                        </select>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="cancel-transaction-btn" class="btn btn-secondary">Cancel</button>
                        <button type="submit" id="save-transaction-btn" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="js/include-menu.js"></script>
    <script src="js/include-header.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/header.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/transactions.js"></script>
    <script src="js/balance.js"></script>
    <script src="js/render.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
