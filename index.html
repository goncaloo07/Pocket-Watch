<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO -->
    <meta 
        name="description" 
        content="Pocket Watch is a personal finance web app that helps you track your spending and savings and better understand how you manage your money."
    >
    <meta name="author" content="Gonçalo Pinto">
    <!-- Theme -->
    <meta id="theme-color-meta" name="theme-color" content="#ffffff">
    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="Pocket Watch">
    <meta 
        property="og:description" 
        content="A personal finance web app to track your spending and savings and better understand how you manage your money."
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pocket-watch-murex.vercel.app/">
    <!-- <meta property="og:image" content="https://pocket-watch-murex.vercel.app/assets/preview.png"> -->
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pocket Watch">
    <meta 
        name="twitter:description" 
        content="A personal finance web app to track your spending and savings and better understand how you manage your money."
    >
    <!-- <meta name="twitter:image" content="https://pocket-watch-murex.vercel.app/assets/preview.png"> -->
    <!-- Favicon -->
    <link rel="shortcut icon" id="shortcut-icon" type="image/png" href="/assets/icons/light/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/light/android-chrome-512x512.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/light/android-chrome-192x192.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/light/favicon-32x32.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/light/favicon-16x16.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/dark/android-chrome-512x512.png" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/dark/android-chrome-192x192.png" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/dark/favicon-32x32.png" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/dark/favicon-16x16.png" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/light/apple-touch-icon.png">
    <link rel="manifest" id="manifest-link" href="/assets/icons/light/site.webmanifest">
    <script>
        const themeMedia = window.matchMedia('(prefers-color-scheme: dark)');
        const updateTheme = () => {
            const dark = themeMedia.matches;
            const themeColorMeta = document.getElementById('theme-color-meta');
            const manifestLink = document.getElementById('manifest-link');
            const shortcutIcon = document.getElementById('shortcut-icon');
            if (themeColorMeta) themeColorMeta.content = dark ? '#000000' : '#ffffff';
            if (manifestLink) manifestLink.href = dark ? '/assets/icons/dark/site.webmanifest' : '/assets/icons/light/site.webmanifest';
            if (shortcutIcon) shortcutIcon.href = dark ? '/assets/icons/dark/android-chrome-512x512.png' : '/assets/icons/light/android-chrome-512x512.png';
        };
        if (themeMedia.addEventListener) {
            themeMedia.addEventListener('change', updateTheme);
        } else if (themeMedia.addListener) {
            themeMedia.addListener(updateTheme);
        }
        updateTheme();
    </script>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
    <title>Pocket Watch | Personal Finance Dashboard</title>
</head>
<body>
    <script src="js/script.js"></script>
</body>
</html>
