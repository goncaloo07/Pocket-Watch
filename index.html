<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <!-- SEO -->
    <meta 
        name="description" 
        content="Pocket Watch is a personal finance web app that helps you track your spending and savings and better understand how you manage your money."
    >
    <meta name="author" content="Gonçalo Pinto">
    <link rel="canonical" id="canonical-link" href="https://pocket-watch-murex.vercel.app/">
    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="Pocket Watch">
    <meta 
        property="og:description" 
        content="A personal finance web app to track your spending and savings and better understand how you manage your money."
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pocket-watch-murex.vercel.app/">
    <meta property="og:image" content="https://pocket-watch-murex.vercel.app/assets/og-image.png">
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pocket Watch">
    <meta 
        name="twitter:description" 
        content="A personal finance web app to track your spending and savings and better understand how you manage your money."
    >
    <meta name="twitter:image" content="https://pocket-watch-murex.vercel.app/assets/og-image.png">
    <!-- Google -->
    <meta name="google-site-verification" content="iO71dL6rz4jZnBa4DTM9rSYGyLzqJqWHauYCY_QRPgk" />
    <!-- Favicon -->
    <link rel="shortcut icon" id="shortcut-icon" type="image/x-icon" href="/assets/icons/light/favicon.ico">
    <link rel="icon" id="favicon-16" type="image/png" sizes="16x16" href="/assets/icons/light/favicon-16x16.png">
    <link rel="icon" id="favicon-32" type="image/png" sizes="32x32" href="/assets/icons/light/favicon-32x32.png">
    <link rel="apple-touch-icon" id="apple-touch-icon" sizes="180x180" href="/assets/icons/light/apple-touch-icon.png">
    <link rel="manifest" id="manifest-link" href="/assets/icons/light/site.webmanifest">

    <!-- Preload Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com">    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Archivo:ital,wght@0,100..900;1,100..900&family=Manrope:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800,900&display=swap" media="print" onload="this.media='all'">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" media="print" onload="this.media='all'"> <!-- Bootstrap Icons -->
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Archivo:ital,wght@0,100..900;1,100..900&family=Manrope:wght@400;500;600;700;800&display=swap">
        <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800,900&display=swap">
    </noscript>
    <title>Pocket Watch</title>

    <!-- Scripts -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "Pocket Watch",
            "url": "https://pocket-watch-murex.vercel.app/",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript",
            "offers": {
                "@type": "Offer",
                "price": "0",
                "priceCurrency": "EUR"
            },
            "author": {
                "@type": "Person",
                "name": "Gonçalo Pinto",
                "url": "https://github.com/goncaloo07"
            }
        }
    </script>
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="menu-placeholder"></div>
    <main id="main-content" class="main-content">
        <div id="page-content"></div>

        <!-- Add budget modal -->
        <div id="budget-modal-overlay" class="modal-overlay">
            <div id="budget-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="budget-modal-title">
                <div class="modal-header">
                    <h1 id="budget-modal-title" class="container-title" data-i18n="budgets.add"></h1>
                    <button id="close-budget-modal-btn" class="close-btn" data-i18n-aria="common.close">
                        <i class="bi bi-x" aria-hidden="true"></i>
                    </button>
                </div>

                <form id="budget-form" class="modal-form">
                    <div class="form-group">
                        <label for="budget-category-spending" class="category-label-spending" data-i18n="common.category"></label>
                        <select id="budget-category-spending" name="budget-category-spending" class="category-select-spending">
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="budget-limit" data-i18n="budgetModal.limit"></label>
                        <div class="budget-slider-wrap">
                            <input type="range" id="budget-limit" name="budget-limit" min="0" max="1000" step="5" value="100">
                            <span id="budget-limit-value" class="budget-slider-value" tabindex="0">100</span>
                            <input type="text" id="budget-limit-input" class="budget-slider-input hidden" inputmode="decimal" autocomplete="off" value="100">
                        </div>
                        <span id="budget-limit-error" class="input-error hidden" data-i18n="budgetModal.limitError"></span>
                    </div>

                    <div class="form-group">
                        <label data-i18n="budgetModal.renews"></label>
                        <div class="type-toggle">
                            <input type="radio" id="budget-period-recurring" name="budget-period" value="recurring" checked>
                            <label for="budget-period-recurring" class="type-option budget-period-recurring">
                                <i class="bi bi-arrow-repeat" aria-hidden="true"></i> <span data-i18n="budgetModal.everySoOften"></span>
                            </label>

                            <input type="radio" id="budget-period-date" name="budget-period" value="date">
                            <label for="budget-period-date" class="type-option budget-period-date">
                                <i class="bi bi-calendar-event" aria-hidden="true"></i> <span data-i18n="budgetModal.untilDate"></span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group budget-recurring-group">
                        <label for="budget-recurring-unit" data-i18n="budgetModal.frequency"></label>
                        <select id="budget-recurring-unit" name="budget-recurring-unit">
                            <option value="weekly" data-i18n="budget.weekly"></option>
                            <option value="monthly" data-i18n="budget.monthly" selected></option>
                            <option value="yearly" data-i18n="budget.yearly"></option>
                        </select>
                    </div>

                    <div class="form-group budget-end-date-group">
                        <label for="budget-end-date" data-i18n="budgetModal.endDate"></label>
                        <input type="date" id="budget-end-date" name="budget-end-date">
                        <span id="budget-end-date-error" class="input-error hidden" data-i18n="budgetModal.endDateError"></span>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="cancel-budget-btn" class="btn btn-secondary" data-i18n="common.cancel"></button>
                        <button type="submit" id="save-budget-btn" class="btn btn-primary" data-i18n="common.save"></button>
                    </div>
                </form>
            </div>
        </div>

        <div id="transaction-modal-overlay" class="modal-overlay">
            <div id="transaction-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="transaction-modal-title">
                <div class="modal-header">
                    <h1 id="transaction-modal-title" class="container-title" data-i18n="transactionModal.add"></h1>
                    <button id="close-modal-btn" class="close-btn" data-i18n-aria="common.close">
                        <i class="bi bi-x" aria-hidden="true"></i>
                    </button>
                </div>

                <form id="transaction-form" class="modal-form">
                    <div class="form-group">
                        <label for="transaction-name" data-i18n="common.name"></label>
                        <input type="text" id="transaction-name" name="transaction-name" data-i18n-placeholder="transactionModal.namePlaceholder" required>
                    </div>

                    <div class="form-group">
                        <label data-i18n="common.type"></label>
                        <div class="type-toggle">
                            <input type="radio" id="type-spending" name="transaction-type" value="spending" checked>
                            <label for="type-spending" class="type-option type-spending">
                                <i class="bi bi-arrow-down-circle" aria-hidden="true"></i> <span data-i18n="common.spending"></span>
                            </label>

                            <input type="radio" id="type-receiving" name="transaction-type" value="receiving">
                            <label for="type-receiving" class="type-option type-receiving">
                                <i class="bi bi-arrow-up-circle" aria-hidden="true"></i> <span data-i18n="common.receiving"></span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="transaction-amount" data-i18n="common.amount"></label>
                        <div class="amount-input-wrap">
                            <span id="transaction-currency-symbol" class="amount-currency">€</span>
                            <input type="text" id="transaction-amount" name="transaction-amount" placeholder="0.00" inputmode="decimal" autocomplete="off" required>
                        </div>
                        <span id="amount-error" class="input-error hidden" data-i18n="transactionModal.amountError"></span>
                    </div>

                    <div class="form-group">
                        <label for="transaction-date" data-i18n="common.date"></label>
                        <input type="date" id="transaction-date" name="transaction-date" required>
                    </div>

                    <div class="form-group">
                        <label for="transaction-category-spending" class="category-label-spending" data-i18n="common.category"></label>
                        <select id="transaction-category-spending" name="transaction-category-spending" class="category-select-spending">
                        </select>

                        <label for="transaction-category-receiving" class="category-label-receiving" data-i18n="common.category"></label>
                        <select id="transaction-category-receiving" name="transaction-category-receiving" class="category-select-receiving">
                        </select>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="cancel-transaction-btn" class="btn btn-secondary" data-i18n="common.cancel"></button>
                        <button type="submit" id="save-transaction-btn" class="btn btn-primary" data-i18n="common.save"></button>
                    </div>
                </form>
            </div>
        </div>

        <div id="edit-transaction-modal-overlay" class="modal-overlay">
            <div id="edit-transaction-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-transaction-modal-title">
                <div class="modal-header">
                    <h1 id="edit-transaction-modal-title" class="container-title" data-i18n="transactionModal.details"></h1>
                    <button id="close-edit-modal-btn" class="close-btn" data-i18n-aria="common.close">
                        <i class="bi bi-x" aria-hidden="true"></i>
                    </button>
                </div>

                <form id="edit-transaction-form" class="modal-form">
                    <div class="form-group">
                        <label for="edit-transaction-name" data-i18n="common.name"></label>
                        <input type="text" id="edit-transaction-name" required>
                    </div>

                    <div class="form-group">
                        <label data-i18n="common.type"></label>
                        <span id="edit-transaction-type" class="edit-type-badge"></span>
                    </div>

                    <div class="form-group">
                        <label for="edit-transaction-amount" data-i18n="common.amount"></label>
                        <div class="amount-input-wrap">
                            <span id="edit-transaction-currency-symbol" class="amount-currency">€</span>
                            <input type="text" id="edit-transaction-amount" inputmode="decimal" autocomplete="off" required>
                        </div>
                        <span id="edit-amount-error" class="input-error hidden" data-i18n="transactionModal.amountError"></span>
                        <span id="edit-amount-note" class="transaction-meta hidden"></span>
                    </div>

                    <div class="form-group">
                        <label for="edit-transaction-date" data-i18n="common.date"></label>
                        <input type="date" id="edit-transaction-date" required>
                    </div>

                    <div class="form-group">
                        <label for="edit-transaction-category" data-i18n="common.category"></label>
                        <select id="edit-transaction-category"></select>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="delete-transaction-btn" class="btn btn-danger" data-i18n="common.delete"></button>
                        <button type="button" id="edit-mode-btn" class="btn btn-secondary" data-i18n="common.edit"></button>
                        <button type="button" id="cancel-edit-btn" class="btn btn-secondary" data-i18n="common.cancel"></button>
                        <button type="submit" id="save-edit-btn" class="btn btn-primary" data-i18n="common.save"></button>
                    </div>
                </form>
            </div>
        </div>

        <div id="edit-budget-modal-overlay" class="modal-overlay">
            <div id="edit-budget-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-budget-modal-title">
                <div class="modal-header">
                    <h1 id="edit-budget-modal-title" class="container-title" data-i18n="budgetModal.details"></h1>
                    <button id="close-edit-budget-modal-btn" class="close-btn" data-i18n-aria="common.close">
                        <i class="bi bi-x" aria-hidden="true"></i>
                    </button>
                </div>

                <form id="edit-budget-form" class="modal-form">
                    <div class="form-group">
                        <label data-i18n="common.category"></label>
                        <span id="edit-budget-category" class="edit-type-badge"></span>
                    </div>

                    <div class="form-group">
                        <label for="edit-budget-limit" data-i18n="budgetModal.limit"></label>
                        <div class="amount-input-wrap">
                            <span id="edit-budget-currency-symbol" class="amount-currency">€</span>
                            <input type="text" id="edit-budget-limit" inputmode="decimal" autocomplete="off" required>
                        </div>
                        <span id="edit-budget-limit-error" class="input-error hidden" data-i18n="budgetModal.limitError"></span>
                        <span id="edit-budget-limit-note" class="transaction-meta hidden"></span>
                    </div>

                    <div class="form-group">
                        <label data-i18n="budgetModal.renews"></label>
                        <div class="type-toggle">
                            <input type="radio" id="edit-budget-period-recurring" name="edit-budget-period" value="recurring" checked>
                            <label for="edit-budget-period-recurring" class="type-option budget-period-recurring">
                                <i class="bi bi-arrow-repeat" aria-hidden="true"></i> <span data-i18n="budgetModal.everySoOften"></span>
                            </label>

                            <input type="radio" id="edit-budget-period-date" name="edit-budget-period" value="date">
                            <label for="edit-budget-period-date" class="type-option budget-period-date">
                                <i class="bi bi-calendar-event" aria-hidden="true"></i> <span data-i18n="budgetModal.untilDate"></span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group budget-recurring-group">
                        <label for="edit-budget-recurring-unit" data-i18n="budgetModal.frequency"></label>
                        <select id="edit-budget-recurring-unit">
                            <option value="weekly" data-i18n="budget.weekly"></option>
                            <option value="monthly" data-i18n="budget.monthly"></option>
                            <option value="yearly" data-i18n="budget.yearly"></option>
                        </select>
                    </div>

                    <div class="form-group budget-end-date-group">
                        <label for="edit-budget-end-date" data-i18n="budgetModal.endDate"></label>
                        <input type="date" id="edit-budget-end-date">
                        <span id="edit-budget-end-date-error" class="input-error hidden" data-i18n="budgetModal.endDateError"></span>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="delete-budget-btn" class="btn btn-danger" data-i18n="common.delete"></button>
                        <button type="button" id="edit-budget-mode-btn" class="btn btn-secondary" data-i18n="common.edit"></button>
                        <button type="button" id="cancel-edit-budget-btn" class="btn btn-secondary" data-i18n="common.cancel"></button>
                        <button type="submit" id="save-edit-budget-btn" class="btn btn-primary" data-i18n="common.save"></button>
                    </div>
                </form>
            </div>
        </div>

        <div id="confirm-modal-overlay" class="modal-overlay">
            <div id="confirm-modal" class="modal" role="dialog" aria-modal="true">
                <div class="modal-header">
                    <h1 id="confirm-modal-title" class="container-title" data-i18n="common.confirm"></h1>
                </div>
                <div class="confirm-modal-form">
                    <p id="confirm-modal-message"></p>
                    <div class="modal-actions">
                        <button type="button" id="confirm-cancel-btn" class="btn btn-secondary" data-i18n="common.cancel"></button>
                        <button type="button" id="confirm-ok-btn" class="btn btn-danger" data-i18n="common.confirm"></button>
                    </div>
                </div>
            </div>
        </div>

        <div id="export-modal-overlay" class="modal-overlay">
            <div id="export-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="export-modal-title">
                <div class="modal-header">
                    <h1 id="export-modal-title" class="container-title" data-i18n="exportModal.title"></h1>
                    <button id="close-export-modal-btn" class="close-btn" data-i18n-aria="common.close">
                        <i class="bi bi-x" aria-hidden="true"></i>
                    </button>
                </div>
                <form id="export-form" class="modal-form">
                    <div class="form-group">
                        <label data-i18n="exportModal.format"></label>
                        <div class="type-toggle settings-toggle">
                            <input type="radio" id="export-format-json" name="export-format" value="json" checked>
                            <label for="export-format-json" class="type-option">
                                <i class="bi bi-filetype-json" aria-hidden="true"></i> JSON
                            </label>
                            <input type="radio" id="export-format-csv" name="export-format" value="csv">
                            <label for="export-format-csv" class="type-option">
                                <i class="bi bi-filetype-csv" aria-hidden="true"></i> CSV
                            </label>
                        </div>
                        <span class="transaction-meta export-hint export-hint-json" data-i18n="exportModal.jsonHint"></span>
                        <span class="transaction-meta export-hint export-hint-csv" data-i18n="exportModal.csvHint"></span>
                    </div>
                    <div class="modal-actions">
                        <button type="button" id="cancel-export-btn" class="btn btn-secondary" data-i18n="common.cancel"></button>
                        <button type="submit" id="save-export-btn" class="btn btn-primary" data-i18n="settings.export"></button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="toast" class="toast hidden" role="alert"></div>
    
    <div id="footer-placeholder"></div>

    <script src="js/translate.js" defer></script>
    <script src="js/router.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/header.js" defer></script>
    <script src="js/menu.js" defer></script>
    <script src="js/footer.js" defer></script>
    <script src="js/transactions.js" defer></script>
    <script src="js/balance.js" defer></script>
    <script src="js/render.js" defer></script>
    <script src="js/chart.js" defer></script>
    <script src="js/budget.js" defer></script>
    <script src="js/confirm.js" defer></script>
    <script src="js/settings.js" defer></script>
    <script src="js/currency.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/include-partials.js" defer></script>
</body>
</html>
