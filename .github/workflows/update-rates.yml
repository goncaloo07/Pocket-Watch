name: Update exchange rates
 
on:
  schedule:
    - cron: "0 17 * * 1-5"
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
 
      - name: Fetch the latest rates
        run: node scripts/update-rates.js
 
      - name: Save the file if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git diff --staged --quiet || (git commit -m "update exchange rates" && git push)