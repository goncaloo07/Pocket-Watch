<header id="header">
    <nav id="header-nav" class="header-nav">
        <button id="menu-btn" aria-label="Abrir menu" aria-expanded="false">
            <span class="menu-icon-wrap">
                <i class="bi bi-list menu-icon icon-list" aria-hidden="true"></i>
                <i class="bi bi-x menu-icon icon-x" aria-hidden="true"></i>
            </span>
        </button>
        <a id="logo-link" href="/">
            <img id="logo-img" class="brand-logo" src="/assets/icons/light/logo.png" alt="Pocket Watch Logo">
            <span id="logo-text">Pocket<span class="highlight">Watch</span></span>
        </a>
        <div id="header-actions">
            <button id="theme-toggle-btn" class="header-action-btn" aria-label="Alternar tema">
                <i class="bi bi-sun" id="theme-toggle-icon" aria-hidden="true"></i>
            </button>
            <button id="settings-btn" class="header-action-btn" aria-label="Definições">
                <i class="bi bi-gear" aria-hidden="true"></i>
            </button>
        </div>
    </nav>
</header>
