<header id="header">
    <nav id="header-nav" class="header-nav" data-i18n-aria="header.navAria">
        <button id="menu-btn" data-i18n-aria="header.openMenu" aria-expanded="false" aria-controls="menu">
            <span class="menu-icon-wrap">
                <i class="bi bi-list menu-icon icon-list" aria-hidden="true"></i>
                <i class="bi bi-x menu-icon icon-x" aria-hidden="true"></i>
            </span>
        </button>
        <a id="logo-link" href="/">
            <img id="logo-img" class="brand-logo" src="/assets/icons/light/logo.webp" alt="Pocket Watch Logo">
            <span id="logo-text">Pocket<span class="highlight">Watch</span></span>
        </a>
        <div id="header-actions">
            <button id="theme-toggle-btn" class="header-action-btn" data-i18n-aria="header.toggleTheme">
                <i class="bi bi-sun" id="theme-toggle-icon" aria-hidden="true"></i>
            </button>
            <button id="settings-btn" class="header-action-btn" data-i18n-aria="header.settings">
                <i class="bi bi-gear" aria-hidden="true"></i>
            </button>
        </div>
    </nav>
</header>
