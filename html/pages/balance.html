<div id="balance-page" class="balance-page">
    <div id="balance-chart-div" class="container balance-chart-div">
        <div class="balance-chart-header">
            <h1 class="container-title">Balance History</h1>
            <div class="balance-period-toggle">
                <input type="radio" id="balance-period-7d" name="balance-period" value="7d">
                <label for="balance-period-7d" class="balance-period-option">7D</label>

                <input type="radio" id="balance-period-30d" name="balance-period" value="30d" checked>
                <label for="balance-period-30d" class="balance-period-option">30D</label>

                <input type="radio" id="balance-period-1y" name="balance-period" value="1y">
                <label for="balance-period-1y" class="balance-period-option">1Y</label>

                <input type="radio" id="balance-period-all" name="balance-period" value="all">
                <label for="balance-period-all" class="balance-period-option">All</label>
            </div>
        </div>
        <div class="balance-chart-svg-wrap">
            <div id="balance-grid-labels" class="balance-grid-labels"></div>
            <div class="balance-chart-svg-inner">
                <svg id="balance-chart-svg" viewBox="0 0 600 200" class="balance-chart-svg" preserveAspectRatio="none">
                    <g id="balance-grid"></g>
                    <path id="balance-line" d="" fill="none" stroke="var(--accent-color)" stroke-width="2"/>
                    <g id="balance-points"></g>
                    <g id="balance-hover-points"></g>
                </svg>
                <div id="balance-tooltip" class="balance-tooltip hidden"></div>
            </div>
        </div>
    </div>

    <div id="balance-summary-div" class="container balance-summary-div">
    </div>
</div>
