<div id="transactions-page" class="transactions-page">
    <div id="transactions-list-div" class="container transactions-list-div">
        <h1 class="container-title"> <span data-i18n="menu.transactions"></span>
            <div class="transactions-title-actions">
                <div class="search-wrap">
                    <i class="bi bi-search" aria-hidden="true"></i>
                    <input type="text" id="search-input" data-i18n-placeholder="transactions.search" data-i18n-aria="transactions.searchAria">
                </div>
                <button id="filter-toggle-btn" class="add-btn" data-i18n-aria="transactions.filterAria" aria-expanded="false" aria-controls="filter-panel">
                    <i class="bi bi-funnel" aria-hidden="true"></i>
                </button>
                <button id="add-transaction-btn" class="add-btn" data-i18n-aria="transactionModal.add">+</button>
            </div>
        </h1>
        <div id="filter-panel" class="filter-panel hidden">
            <div class="filter-row">
                <div class="form-group">
                    <label data-i18n="common.type"></label>
                    <div class="type-toggle filter-type-toggle" role="radiogroup" data-i18n-aria="common.type">
                        <input type="radio" id="filter-type-all" name="filter-type" value="all" checked>
                        <label for="filter-type-all" class="type-option" data-i18n="common.all"></label>

                        <input type="radio" id="filter-type-spending" name="filter-type" value="spending">
                        <label for="filter-type-spending" class="type-option" data-i18n="common.spending"></label>

                        <input type="radio" id="filter-type-receiving" name="filter-type" value="receiving">
                        <label for="filter-type-receiving" class="type-option" data-i18n="common.receiving"></label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="filter-category" data-i18n="common.category"></label>
                    <select id="filter-category">
                        <option value="all" data-i18n="transactions.allCategories"></option>
                    </select>
                </div>
            </div>

            <div class="filter-row">
                <div class="form-group">
                    <label data-i18n="transactions.dateRange"></label>
                    <div class="filter-date-range">
                        <input type="date" id="filter-date-from" autocomplete="off" data-i18n-aria="filters.from">
                        <span class="filter-amount-sep">-</span>
                        <input type="date" id="filter-date-to" autocomplete="off" data-i18n-aria="filters.until">
                    </div>
                </div>

                <div class="form-group">
                    <label data-i18n="transactions.amountRange"></label>
                    <div class="filter-amount-slider-wrap">
                        <div class="filter-amount-values">
                            <span id="filter-amount-min-value">0€</span>
                            <span class="filter-amount-sep">-</span>
                            <span id="filter-amount-max-value">1000€</span>
                        </div>
                        <div class="filter-range-track">
                            <div id="filter-range-fill" class="filter-range-fill"></div>
                            <input type="range" id="filter-amount-min" min="0" max="1000" step="5" value="0" autocomplete="off" data-i18n-aria="transactions.minAmount">
                            <input type="range" id="filter-amount-max" min="0" max="1000" step="5" value="1000" autocomplete="off" data-i18n-aria="transactions.maxAmount">
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" id="filter-clear-btn" class="btn btn-secondary" data-i18n="transactions.clearFilters"></button>
        </div>
        <div id="active-filters" class="active-filters hidden"></div>
        <ul id="transactions-list" class="transactions-list"></ul>
        <div id="transactions-sentinel" aria-hidden="true"></div>
        <div id="transactions-no-results" class="transactions-empty hidden">
            <i class="bi bi-search transactions-empty-icon" aria-hidden="true"></i>
            <p class="transactions-empty-title" data-i18n="transactions.noMatchesTitle"></p>
            <p class="transactions-empty-subtitle" data-i18n="transactions.noMatchesSubtitle"></p>
        </div>
    </div>
    <div id="transactions-empty" class="transactions-empty hidden">
        <i class="bi bi-receipt transactions-empty-icon" aria-hidden="true"></i>
        <p class="transactions-empty-title" data-i18n="transactions.emptyTitle"></p>
        <p class="transactions-empty-subtitle" data-i18n="transactions.emptySubtitle"></p>
        <button id="add-transaction-btn-empty" class="btn btn-primary transactions-empty-btn">
            <i class="bi bi-plus-lg" aria-hidden="true"></i> <span data-i18n="transactionModal.add"></span>
        </button>
    </div>
</div>
