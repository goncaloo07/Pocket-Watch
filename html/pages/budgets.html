<div id="budget-page" class="transactions-page">

        <h1 class="container-title"> <span data-i18n="menu.budgets"></span>
            <button id="add-budget-btn" class="add-btn">+</button>
        </h1>
        <ul id="budget-list" class="budget-list"></ul>
    </div>
    <div id="budget-empty" class="transactions-empty hidden">
        <i class="bi bi-piggy-bank transactions-empty-icon" aria-hidden="true"></i>
        <p class="transactions-empty-title" data-i18n="budgets.emptyTitle"></p>
        <p class="transactions-empty-subtitle" data-i18n="budgets.emptySubtitle"></p>
        <button id="add-budget-btn-empty" class="btn btn-primary transactions-empty-btn">
            <i class="bi bi-plus-lg" aria-hidden="true"></i> <span data-i18n="budgets.add"></span>
        </button>
    </div>
</div>
