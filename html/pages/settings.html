<div id="settings-page" class="settings-page">
    <h1 class="container-title" data-i18n="settings.title"></h1>

    <section id="settings-appearance" class="container settings-section" aria-labelledby="settings-appearance-title">
        <h2 class="settings-section-title" id="settings-appearance-title" data-i18n="settings.appearance"></h2>
        <div class="settings-row">
            <div class="settings-row-text">
                <span id="settings-theme-label" class="settings-row-label" data-i18n="settings.theme"></span>
                <span class="settings-row-hint" data-i18n="settings.themeHint"></span>
            </div>
            <div class="type-toggle settings-toggle" role="radiogroup" aria-labelledby="settings-theme-label">
                <input type="radio" id="settings-theme-light" name="settings-theme" value="light">
                <label for="settings-theme-light" class="type-option">
                    <i class="bi bi-sun" aria-hidden="true"></i> <span data-i18n="settings.light"></span>
                </label>

                <input type="radio" id="settings-theme-dark" name="settings-theme" value="dark">
                <label for="settings-theme-dark" class="type-option">
                    <i class="bi bi-moon" aria-hidden="true"></i> <span data-i18n="settings.dark"></span>
                </label>

                <input type="radio" id="settings-theme-system" name="settings-theme" value="system" checked>
                <label for="settings-theme-system" class="type-option">
                    <i class="bi bi-circle-half" aria-hidden="true"></i> <span data-i18n="settings.system"></span>
                </label>
            </div>
        </div>
    </section>

    <section id="settings-currency-section" class="container settings-section" aria-labelledby="settings-currency-title">
        <h2 class="settings-section-title" id="settings-currency-title" data-i18n="settings.currency"></h2>
        <div class="settings-row">
            <div class="settings-row-text">
                <label for="settings-currency" class="settings-row-label" data-i18n="settings.currency"></label>
                <span class="settings-row-hint" data-i18n="settings.currencyHint"></span>
            </div>
            <div class="form-group settings-control">
                <select id="settings-currency" name="settings-currency">
                </select>
            </div>
        </div>
    </section>

    <section id="settings-language-section" class="container settings-section" aria-labelledby="settings-language-title">
        <h2 class="settings-section-title" id="settings-language-title" data-i18n="settings.language"></h2>
        <div class="settings-row">
            <div class="settings-row-text">
                <label for="settings-language" class="settings-row-label" data-i18n="settings.appLanguage"></label>
                <span class="settings-row-hint" data-i18n="settings.languageHint"></span>
            </div>
            <div class="form-group settings-control">
                <select id="settings-language" name="settings-language">
                    <option value="en" selected>English</option>
                    <option value="pt">Português</option>
                </select>
            </div>
        </div>
    </section>

    <section id="settings-data-section" class="container settings-section" aria-labelledby="settings-data-title">
        <h2 class="settings-section-title" id="settings-data-title" data-i18n="settings.data"></h2>

        <div class="settings-row">
            <div class="settings-row-text">
                <span class="settings-row-label" data-i18n="settings.exportLabel"></span>
                <span class="settings-row-hint" data-i18n="settings.exportHint"></span>
            </div>
            <button type="button" id="export-data-btn" class="btn btn-secondary settings-btn">
                <i class="bi bi-download" aria-hidden="true"></i> <span data-i18n="settings.export"></span>
            </button>
        </div>

        <div class="settings-row">
            <div class="settings-row-text">
                <span class="settings-row-label" data-i18n="settings.importLabel"></span>
                <span class="settings-row-hint" data-i18n="settings.importHint"></span>
            </div>
            <button type="button" id="import-data-btn" class="btn btn-secondary settings-btn">
                <i class="bi bi-upload" aria-hidden="true"></i> <span data-i18n="settings.import"></span>
            </button>
            <input type="file" id="import-data-input" class="hidden" accept="application/json,.json,text/csv,.csv" data-i18n-aria="settings.importAria">
        </div>

        <div class="settings-row">
            <div class="settings-row-text">
                <span class="settings-row-label" data-i18n="settings.deleteLabel"></span>
                <span class="settings-row-hint" data-i18n="settings.deleteHint"></span>
            </div>
            <button type="button" id="delete-data-btn" class="btn btn-danger settings-btn">
                <i class="bi bi-trash" aria-hidden="true"></i> <span data-i18n="settings.delete"></span>
            </button>
        </div>
    </section>
</div>
